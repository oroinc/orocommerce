layout:
    conditions: 'context["is_embedded_fragment"]'
    actions:
        - '@add':
            id: embedded_customer_user_dashboard
            parentId: page_main_content
            blockType: container

        - '@setOption':
            id: page_content
            optionName: vars.sidebarExpanded
            optionValue: false

        - '@setOption':
            id: chart_volume_collapse_body
            optionName: attr.data-state-id
            optionValue: 'purchase-volume-chart'

        - '@move':
            id: page_content
            parentId: embedded_customer_user_dashboard

        - '@move':
            id: shoppinglist_collection
            parentId: embedded_customer_user_dashboard
