layout:
    conditions: 'context["is_embedded_fragment"]'
    actions:
        - '@add':
            id: embedded_shopping_list
            parentId: page_content
            blockType: container

        - '@move':
            id: container
            parentId: embedded_shopping_list

        - '@move':
            id: no_shopping_lists
            parentId: embedded_shopping_list

        - '@move':
            id: shoppinglist_collection
            parentId: embedded_shopping_list
            prepend: false
