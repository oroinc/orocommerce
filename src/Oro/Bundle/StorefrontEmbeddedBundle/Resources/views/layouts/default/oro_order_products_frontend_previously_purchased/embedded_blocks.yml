layout:
    conditions: 'context["is_embedded_fragment"]'
    actions:
        - '@add':
            id: embedded_previously_purchased
            parentId: page_main_content
            blockType: container

        - '@setOption':
            id: page_content
            optionName: vars.sidebarExpanded
            optionValue: false

        - '@move':
            id: page_content
            parentId: embedded_previously_purchased

        - '@move':
            id: shoppinglist_collection
            parentId: embedded_previously_purchased

        - '@move':
            id: product_mass_actions_sticky_container
            parentId: embedded_previously_purchased
