layout:
    conditions: 'context["is_embedded_fragment"]'
    actions:
        - '@add':
            id: embedded_customer_users
            parentId: page_main_content
            blockType: container

        - '@setOption':
            id: page_content
            optionName: vars.sidebarExpanded
            optionValue: false

        - '@move':
            id: page_content
            parentId: embedded_customer_users
