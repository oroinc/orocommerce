parameters:
    oro_storefront_embedded.theme_build_path: '/build'
    oro_storefront_embedded.theme_assets_excluded_patterns: ['*.map', '*.scss', '*.scss.js']

services:
    oro_storefront_embedded.request.embedded_request_checker:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Request\EmbeddedRequestChecker
        arguments:
            - '@request_stack'

    oro_storefront_embedded.provider.embedded_request_file_url:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedRequestFileUrlProvider
        decorates: oro_attachment.provider.file_url
        # Outermost decorator (oro_frontend 500, oro_multiwebsite 250, external_url_provider -250), so the reference
        # type is absolute before the inner providers build the url.
        decoration_priority: -300
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.provider.embedded_request_imagine_url:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedRequestImagineUrlProvider
        decorates: oro_attachment.imagine.provider.url
        # Runs outside oro_attachment.imagine.provider.url.webp_aware (-100), which must get the final reference type.
        decoration_priority: -200
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.tools.embedded_request_url_helper:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Tools\EmbeddedRequestUrlHelper
        decorates: oro_ui.tools.url_helper
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.event_listener.embedded_request_vary:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\EmbeddedRequestVaryListener
        arguments:
            - '@oro_frontend.request.frontend_helper'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    oro_storefront_embedded.event_listener.embedded_fragment_access:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\EmbeddedFragmentAccessListener
        arguments:
            - '@oro_security.class_authorization_checker'
        tags:
            # Priority -2: runs after oro_security.listener.controller (-1), which sets _oro_access_checked.
            - { name: kernel.event_listener, event: kernel.controller_arguments, method: onKernelControllerArguments, priority: -2 }

    oro_storefront_embedded.event_listener.embedded_fragment_csrf_protection:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\EmbeddedFragmentCsrfProtectionListener
        arguments:
            - '@oro_security.csrf_request_manager'
        tags:
            # Priority -10: runs after oro_platform.event_listener.controller.controller_listener (0), which sets
            # _csrf_protection.
            - { name: kernel.event_listener, event: kernel.controller, method: onKernelController, priority: -10 }

    oro_storefront_embedded.event_listener.embedded_fragment_feature_toggle:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\EmbeddedFragmentFeatureToggleListener
        arguments:
            - '@oro_featuretoggle.checker.feature_checker'
        tags:
            # Priority 1: runs before oro_featuretoggle.event_listener.request (0), which stops propagation with an
            # empty response.
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 1 }

    oro_storefront_embedded.layout.extension.embedded_context_configurator:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Layout\Extension\EmbeddedContextConfigurator
        arguments:
            - '@request_stack'
            - '%oro_storefront_embedded.blocks%'
        tags:
            - { name: layout.context_configurator }

    oro_storefront_embedded.guest_access.embedded_guest_access_allowed_urls_provider:
        class: Oro\Bundle\StorefrontEmbeddedBundle\GuestAccess\EmbeddedGuestAccessAllowedUrlsProvider
        arguments:
            # Only the theme assets list is open to guests, because it names only public static files.
            - ['^/embedded/theme-assets$']
        tags:
            - { name: oro_frontend.guest_access_urls_provider }

    oro_storefront_embedded.cache.theme_assets:
        parent: oro.data.cache
        tags:
            - { name: cache.pool, namespace: oro_storefront_embedded }

    oro_storefront_embedded.provider.embedded_theme_assets:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedThemeAssetsProvider
        arguments:
            - '@oro_layout.current_theme_provider'
            - '@assets.packages'
            - '@oro_storefront_embedded.cache.theme_assets'
            - '%kernel.project_dir%/public'
            - '%oro_storefront_embedded.theme_build_path%'
            - '%oro_storefront_embedded.theme_assets_excluded_patterns%'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: oro_storefront_embedded }

    # Required by EmbeddedThemeAssetsController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedThemeAssetsProvider:
        alias: oro_storefront_embedded.provider.embedded_theme_assets

    oro_storefront_embedded.provider.embedded_runtime_boot:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedRuntimeBootProvider
        arguments:
            - '@oro_layout.data_provider.theme'
            - '@oro_layout.current_theme_provider'
            - '@assets.packages'
            - '@oro_asset.subresource_integrity_provider'
            - '@oro_featuretoggle.checker.feature_checker'

    oro_storefront_embedded.fragment.embedded_fragment_target_resolver:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentTargetResolver
        arguments:
            - '@router'
            - '%oro_storefront_embedded.blocks%'

    # Required by EmbeddedFragmentController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentTargetResolver:
        alias: oro_storefront_embedded.fragment.embedded_fragment_target_resolver

    oro_storefront_embedded.fragment.embedded_fragment_renderer:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentRenderer
        arguments:
            - '@http_kernel'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    # Required by EmbeddedFragmentController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentRenderer:
        alias: oro_storefront_embedded.fragment.embedded_fragment_renderer

    oro_storefront_embedded.fragment.embedded_fragment_response_decorator:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentResponseDecorator
        arguments:
            - '@oro_storefront_embedded.provider.embedded_runtime_boot'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: oro_storefront_embedded }

    # Required by EmbeddedFragmentController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Fragment\EmbeddedFragmentResponseDecorator:
        alias: oro_storefront_embedded.fragment.embedded_fragment_response_decorator

    oro_storefront_embedded.form.type.embedded_preferences:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Form\Type\EmbeddedPreferencesType
        arguments:
            - '@doctrine'
            - '@oro_frontend_localization.manager.user_localization'
            - '@oro_pricing.user_currency_manager'
        tags:
            - { name: form.type }

    oro_storefront_embedded.form.handler.embedded_preferences:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Form\Handler\EmbeddedPreferencesHandler
        arguments:
            - '@doctrine'
            - '@oro_frontend_localization.manager.user_localization'
            - '@oro_pricing.user_currency_manager'

    # Required by EmbeddedPreferencesController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Form\Handler\EmbeddedPreferencesHandler:
        alias: oro_storefront_embedded.form.handler.embedded_preferences
