parameters:
    oro_storefront_embedded.theme_assets_excluded_patterns: ['*.map', '*.scss', '*.scss.js']
    oro_storefront_embedded.fragment_path: '/embedded/fragment'

services:
    oro_storefront_embedded.request.embedded_request_checker:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Request\EmbeddedRequestChecker
        arguments:
            - '@request_stack'

    oro_storefront_embedded.request.embedded_fragment_registry:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Request\EmbeddedFragmentRegistry
        arguments:
            - '%oro_storefront_embedded.fragments%'

    oro_storefront_embedded.request.embedded_fragment_url_resolver:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Request\EmbeddedFragmentUrlResolver
        arguments:
            - '@router'
            - '@oro_storefront_embedded.request.embedded_fragment_registry'
            - '@event_dispatcher'

    oro_storefront_embedded.provider.embedded_request_file_url:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedRequestFileUrlProvider
        decorates: oro_attachment.provider.file_url
        # Outermost decorator (oro_frontend 500, oro_multiwebsite 250, external_url_provider -250), so the reference
        # type is absolute before the inner providers build the url.
        decoration_priority: -300
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.provider.embedded_request_imagine_url:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedRequestImagineUrlProvider
        decorates: oro_attachment.imagine.provider.url
        # Runs outside oro_attachment.imagine.provider.url.webp_aware (-100), which must get the final reference type.
        decoration_priority: -200
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.tools.embedded_request_url_helper:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Tools\EmbeddedRequestUrlHelper
        decorates: oro_ui.tools.url_helper
        arguments:
            - '@.inner'
            - '@oro_storefront_embedded.request.embedded_request_checker'

    oro_storefront_embedded.event_listener.embedded_request_vary:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Kernel\EmbeddedRequestVaryListener
        arguments:
            - '@oro_frontend.request.frontend_helper'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    oro_storefront_embedded.layout.extension.embedded_context_configurator:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Layout\Extension\EmbeddedContextConfigurator
        arguments:
            - '@request_stack'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: layout.context_configurator }

    oro_storefront_embedded.guest_access.embedded_fragment_aware_guest_access_allowed_urls_provider:
        class: Oro\Bundle\StorefrontEmbeddedBundle\GuestAccess\EmbeddedFragmentAwareGuestAccessAllowedUrlsProvider
        arguments:
            # Only the theme assets list is open to guests, because it names only public static files.
            - ['^/embedded/theme-assets$']
        tags:
            - { name: oro_frontend.guest_access_urls_provider }

    oro_storefront_embedded.cache.theme_assets:
        parent: oro.data.cache
        tags:
            - { name: cache.pool, namespace: oro_storefront_embedded }

    oro_storefront_embedded.provider.embedded_theme_assets:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedThemeAssetsProvider
        arguments:
            - '@oro_layout.current_theme_provider'
            - '@assets.packages'
            - '@oro_storefront_embedded.cache.theme_assets'
            - '@oro_distribution.provider.public_directory_provider'
            - '%oro_storefront_embedded.theme_assets_excluded_patterns%'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: oro_storefront_embedded }

    # Required by EmbeddedThemeAssetsController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedThemeAssetsProvider:
        alias: oro_storefront_embedded.provider.embedded_theme_assets

    oro_storefront_embedded.provider.embedded_fragment_styles_metadata:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedFragmentStylesMetadataProvider
        arguments:
            - '@oro_layout.data_provider.theme'
            - '@oro_layout.current_theme_provider'
            - '@assets.packages'

    oro_storefront_embedded.provider.embedded_fragment_js_metadata:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Provider\EmbeddedFragmentJsMetadataProvider
        arguments:
            - '@oro_layout.current_theme_provider'
            - '@assets.packages'
            - '@oro_asset.subresource_integrity_provider'
            - '@oro_featuretoggle.checker.feature_checker'

    oro_storefront_embedded.event_listener.embedded_fragment_request:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Kernel\EmbeddedFragmentRequestListener
        arguments:
            - '@oro_storefront_embedded.request.embedded_fragment_url_resolver'
            - '%oro_storefront_embedded.fragment_path%'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: oro_storefront_embedded }
            # Priority 33: runs after oro_redirect.security.firewall (50), which sets the security token and the router
            # context base url that generating the target url needs, and before router_listener (32), which matches
            # the rewritten request to the target route.
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 33 }

    oro_storefront_embedded.event_listener.embedded_fragment_js_modules_config_block:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentJsModulesConfigBlockListener
        arguments:
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResolveEvent, method: onFragmentResolve }

    oro_storefront_embedded.event_listener.embedded_fragment_title:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentTitleListener
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResolveEvent, method: onFragmentResolve }
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResponseEvent, method: onFragmentResponse }

    oro_storefront_embedded.event_listener.embedded_fragment_response:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Kernel\EmbeddedFragmentResponseListener
        arguments:
            - '@event_dispatcher'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: oro_storefront_embedded }
            # Priority 10: reads the raw layout JSON of the target controller before the listeners that rewrite the
            # body or the headers, such as oro_navigation.event_listener.hash_navigation (0), and takes the flash messages
            # before session_listener (-1000) saves the session.
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 10 }

    oro_storefront_embedded.event_listener.embedded_fragment_flash_messages_response:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentFlashMessagesResponseListener
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResponseEvent, method: onFragmentResponse }

    oro_storefront_embedded.event_listener.embedded_fragment_subtree_url_response:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentSubtreeUrlResponseListener
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResponseEvent, method: onFragmentResponse }

    oro_storefront_embedded.event_listener.embedded_fragment_js_metadata_response:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentJsMetadataResponseListener
        arguments:
            - '@oro_storefront_embedded.provider.embedded_fragment_js_metadata'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResponseEvent, method: onFragmentResponse }

    oro_storefront_embedded.event_listener.embedded_fragment_styles_metadata_response:
        class: Oro\Bundle\StorefrontEmbeddedBundle\EventListener\Fragment\EmbeddedFragmentStylesMetadataResponseListener
        arguments:
            - '@oro_storefront_embedded.provider.embedded_fragment_styles_metadata'
            - '@oro_storefront_embedded.request.embedded_request_checker'
        tags:
            - { name: kernel.event_listener, event: Oro\Bundle\StorefrontEmbeddedBundle\Event\EmbeddedFragmentResponseEvent, method: onFragmentResponse }

    oro_storefront_embedded.form.type.embedded_fragment_preferences:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Form\Type\EmbeddedFragmentPreferencesType
        arguments:
            - '@doctrine'
            - '@oro_frontend_localization.manager.user_localization'
            - '@oro_pricing.user_currency_manager'
        tags:
            - { name: form.type }

    oro_storefront_embedded.form.handler.embedded_fragment_preferences:
        class: Oro\Bundle\StorefrontEmbeddedBundle\Form\Handler\EmbeddedFragmentPreferencesHandler
        arguments:
            - '@doctrine'
            - '@oro_frontend_localization.manager.user_localization'
            - '@oro_pricing.user_currency_manager'

    # Required by EmbeddedPreferencesController (service subscriber)
    Oro\Bundle\StorefrontEmbeddedBundle\Form\Handler\EmbeddedFragmentPreferencesHandler:
        alias: oro_storefront_embedded.form.handler.embedded_fragment_preferences
