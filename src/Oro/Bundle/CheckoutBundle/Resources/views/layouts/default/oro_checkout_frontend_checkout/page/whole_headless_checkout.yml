layout:
    actions:
        - '@setBlockTheme':
            themes: '@OroCheckout/layouts/default/oro_checkout_frontend_checkout/templates/headless/checkout.html.twig'

        - '@remove':
            id: top_nav_container
        - '@remove':
            id: middle_bar_center
        - '@remove':
            id: middle_bar_right
        - '@remove':
            id: header_row
        - '@remove':
            id: main_menu_trigger
        - '@remove':
            id: quick_access_button_container
        - '@remove':
            id: menus_sidebar_container
        - '@remove':
            id: menus_footer_sidebar_container

        - '@appendOption':
            id: page_header
            optionName: attr.class
            optionValue: 'checkout-simplified-header'

        - '@addTree':
            items:
                checkout_simplified_header_actions:
                    blockType: container
                checkout_simplified_header_back_link:
                    blockType: link
                    options:
                        path: '=data["session_transfer_checkout_url"].getReturnUrl()'
                        text: oro.checkout.simplified_header.back_to_shopping.label
                checkout_simplified_header_secure:
                    blockType: block
            tree:
                middle_bar:
                    checkout_simplified_header_actions:
                        checkout_simplified_header_back_link: ~
                        checkout_simplified_header_secure: ~

        - '@setOption':
            id: logo
            optionName: vars.returnUrl
            optionValue: '=data["session_transfer_checkout_url"].getReturnUrl()'

        - '@setOption':
            id: success_order
            optionName: vars.returnUrl
            optionValue: '=data["session_transfer_checkout_url"].getReturnUrl()'

        - '@setOption':
            id: success_order
            optionName: vars.orderViewUrl
            optionValue: '=data["session_transfer_checkout_url"].getOrderViewUrl(data["workflowItem"].getData().get("order"))'

        - '@setOption':
            id: logo
            optionName: src
            optionValue: '=data["asset"].getUrl("bundles/orocheckout/default/images/logo/demob2b-logo.svg")'

        - '@setOption':
            id: logo
            optionName: vars.logo_small
            optionValue: '=data["asset"].getUrl("bundles/orocheckout/default/images/logo/demob2b-logo-small.svg")'

    conditions: 'context["is_in_session_transfer_mode"]'
